<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="120" viewBox="0 0 1060 120" role="img" aria-labelledby="title">
  <title id="title">The analysis steps of pprof: risk adjustment, standardization, inference, plots</title>
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#27508F"/>
      <stop offset="1" stop-color="#1C3A6B"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2566A8"/>
      <stop offset="1" stop-color="#1D4F86"/>
    </linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#227DA8"/>
      <stop offset="1" stop-color="#1B6287"/>
    </linearGradient>
    <linearGradient id="g4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#21908E"/>
      <stop offset="1" stop-color="#18716F"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0B1B33" flood-opacity="0.28"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <rect x="10"  y="22" width="230" height="72" rx="16" fill="url(#g1)"/>
    <rect x="280" y="22" width="230" height="72" rx="16" fill="url(#g2)"/>
    <rect x="550" y="22" width="230" height="72" rx="16" fill="url(#g3)"/>
    <rect x="820" y="22" width="230" height="72" rx="16" fill="url(#g4)"/>
  </g>
  <g fill="url(#shine)">
    <rect x="10"  y="22" width="230" height="72" rx="16"/>
    <rect x="280" y="22" width="230" height="72" rx="16"/>
    <rect x="550" y="22" width="230" height="72" rx="16"/>
    <rect x="820" y="22" width="230" height="72" rx="16"/>
  </g>

  <g fill="#8A94A6">
    <path d="M245 54 h16 v-8 l14 12 l-14 12 v-8 h-16 z"/>
    <path d="M515 54 h16 v-8 l14 12 l-14 12 v-8 h-16 z"/>
    <path d="M785 54 h16 v-8 l14 12 l-14 12 v-8 h-16 z"/>
  </g>

  <g font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', sans-serif"
     font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.2">
    <text x="125" y="65">Risk adjustment</text>
    <text x="395" y="65">Standardization</text>
    <text x="665" y="65">Inference</text>
    <text x="935" y="65">Plots</text>
  </g>
</svg>
