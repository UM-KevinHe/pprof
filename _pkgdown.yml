url: https://um-kevinhe.github.io/pprof/
template:
  bootstrap: 5
  light-switch: true
  math-rendering: mathjax
  bslib:
    base_font: {google: "Source Sans 3"}
    heading_font: {google: "Source Serif 4"}
    code_font: {google: "JetBrains Mono"}

navbar:
  structure:
    left: [intro, articles, reference, news]
    right: [search, lightswitch, github]
  components:
    intro:
      text: Get started
      href: articles/pprof.html
    articles:
      text: Articles
      menu:
      - text: Data preparation
        href: articles/data.html
      - text: Risk-adjustment models
        href: articles/models.html
      - text: Variable selection
        href: articles/selection.html
      - text: Standardized measures
        href: articles/standardization.html
      - text: Tests of provider effects
        href: articles/testing.html
      - text: Reference distributions
        href: articles/null.html
      - text: Reliability
        href: articles/reliability.html
      - text: Plots
        href: articles/plots.html

articles:
- title: Get started
  navbar: ~
  contents:
  - pprof
- title: By analysis step
  navbar: ~
  contents:
  - data
  - models
  - selection
  - standardization
  - testing
  - "null"
  - reliability
  - plots

reference:
- title: Data
  desc: Prepare and check the data every component reads.
  contents:
  - pp_data
  - pp_check
- title: Risk-adjustment models
  desc: Fixed, random and correlated random provider effects.
  contents:
  - fit_logistic_fe
  - fit_linear_fe
  - fit_mixed
  - fit_cox
  - vcov.logistic_fe
  - vcov.linear_fe
  - vcov.cox
  - gamma_variance
- title: Standardized measures
  contents:
  - standardize
  - standardize.logistic_fe
  - standardize.linear_fe
  - standardize_mixed
  - standardize.cox
  - direct_expectation
- title: Tests of provider effects
  contents:
  - test
  - test.logistic_fe
  - test.linear_fe
  - test_mixed
  - test.cox
  - confint.logistic_fe
  - confint.linear_fe
  - confint_mixed
  - confint.cox
  - test_measure
- title: Tests of covariates
  contents:

  - summary.logistic_fe
  - summary.linear_fe
  - summary_mixed
  - summary.cox
- title: Reference distributions
  desc: Theoretical, fixed and empirical nulls, and calibration of a test with one.
  contents:
