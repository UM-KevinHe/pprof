url: https://um-kevinhe.github.io/pprof/
template:
  bootstrap: 5
  light-switch: true
  math-rendering: mathjax
  bslib:
    base_font: {google: "Source Sans 3"}
    heading_font: {google: "Source Serif 4"}
    code_font: {google: "JetBrains Mono"}

navbar:
  structure:
    left: [intro, reference, articles, news]
    right: [search, lightswitch, github]

reference:
- title: Data
  desc: Prepare and check the data every component reads.
  contents:
  - pp_data
  - pp_check
- title: Risk-adjustment models
  desc: Fixed, random and correlated random provider effects.
  contents:
  - fit_logistic_fe
  - fit_linear_fe
  - fit_mixed
  - fit_cox
  - vcov.logistic_fe
  - vcov.linear_fe
  - vcov.cox
  - gamma_variance
- title: Standardized measures
  contents:
  - standardize
  - standardize.logistic_fe
  - standardize.linear_fe
  - standardize_mixed
  - standardize.cox
  - direct_expectation
- title: Tests of provider effects
  contents:
  - test_providers
  - test_providers.logistic_fe
  - test_providers.linear_fe
  - test_providers_mixed
  - test_providers.cox
  - confint.logistic_fe
  - confint.linear_fe
  - confint_mixed
  - confint.cox
  - test_measure
- title: Tests of covariates
  contents:
  - test_covariates
  - test_covariates.logistic_fe
  - test_covariates.linear_fe
  - test_covariates_mixed
  - test_covariates.cox
- title: Reference distributions
  desc: Theoretical, fixed and empirical nulls, and calibration of a test with one.
  contents:
  - null_models
  - assign_groups
  - calibrate
  - adjust_z
- title: Reliability
  contents:
  - iur
  - iur_curve
  - iur_stratified
- title: Variable selection
  desc: Penalized covariate selection with unpenalized provider effects.
  contents:
  - select_lasso
  - cv_lasso
  - coef.pp_lasso
- title: Simulation
  contents:
  - sim_kecc
- title: Package
  contents:
  - pprof-package
